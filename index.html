<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイル見積り</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3f6fb;
      --bg-accent:
        radial-gradient(circle at top left, rgba(14, 116, 144, 0.18), transparent 34%),
        radial-gradient(circle at top right, rgba(249, 115, 22, 0.14), transparent 26%),
        linear-gradient(180deg, #f9fbff 0%, #eef3f8 100%);
      --surface: rgba(255, 255, 255, 0.82);
      --surface-strong: rgba(255, 255, 255, 0.96);
      --surface-soft: rgba(244, 247, 252, 0.92);
      --border: rgba(15, 23, 42, 0.1);
      --text: #142033;
      --text-muted: #5a687d;
      --primary: #0f766e;
      --primary-strong: #115e59;
      --primary-soft: rgba(15, 118, 110, 0.13);
      --warning: #b45309;
      --warning-soft: rgba(180, 83, 9, 0.12);
      --danger: #c2410c;
      --danger-soft: rgba(194, 65, 12, 0.12);
      --shadow: 0 18px 44px rgba(15, 23, 42, 0.1);
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --max-width: 860px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #08111c;
        --bg-accent:
          radial-gradient(circle at top left, rgba(45, 212, 191, 0.12), transparent 34%),
          radial-gradient(circle at top right, rgba(251, 146, 60, 0.14), transparent 28%),
          linear-gradient(180deg, #09111b 0%, #0d1624 100%);
        --surface: rgba(11, 19, 33, 0.84);
        --surface-strong: rgba(14, 23, 38, 0.98);
        --surface-soft: rgba(13, 23, 38, 0.94);
        --border: rgba(148, 163, 184, 0.18);
        --text: #edf4ff;
        --text-muted: #9eb0c5;
        --primary: #41c7bc;
        --primary-strong: #76e0d7;
        --primary-soft: rgba(65, 199, 188, 0.14);
        --warning: #f59e0b;
        --warning-soft: rgba(245, 158, 11, 0.14);
        --danger: #fb923c;
        --danger-soft: rgba(251, 146, 60, 0.14);
        --shadow: 0 24px 48px rgba(2, 6, 23, 0.38);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Hiragino Sans", "Yu Gothic", "BIZ UDPGothic", sans-serif;
      color: var(--text);
      background: var(--bg-accent);
      line-height: 1.5;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(120deg, rgba(255, 255, 255, 0.06), transparent 42%),
        linear-gradient(300deg, rgba(255, 255, 255, 0.04), transparent 34%);
      opacity: 0.8;
    }

    .shell {
      position: relative;
      width: min(calc(100% - 24px), var(--max-width));
      margin: 0 auto;
      padding: 18px 0 26px;
    }

    .app-header {
      margin-bottom: 14px;
      padding: 2px 2px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 2rem);
      line-height: 1.15;
      letter-spacing: 0.02em;
    }

    .stack {
      display: grid;
      gap: 14px;
    }

    .mode-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px;
    }

    .mode-tab {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--text-muted);
      padding: 9px 12px;
      border-radius: 999px;
      font: inherit;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease;
    }

    .mode-tab.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      color: #ffffff;
      box-shadow: 0 8px 18px rgba(15, 118, 110, 0.22);
    }

    body.mode-auction-only .bank-only {
      display: none !important;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      overflow: hidden;
    }

    .card-body {
      padding: 18px;
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--text-muted);
    }

    .input-group {
      display: grid;
      gap: 14px;
    }

    .rate-grid {
      display: grid;
      gap: 8px;
    }

    .rate-row {
      display: grid;
      grid-template-columns: 110px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface-soft);
    }

    .rate-row-label {
      font-size: 0.92rem;
      font-weight: 700;
    }

    .rate-row .input-wrap {
      flex: 1;
    }

    .rate-row .input-wrap input {
      padding: 10px 70px 10px 12px;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .rate-row-profit {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      font-size: 0.78rem;
      font-weight: 700;
      line-height: 1.3;
      min-width: 90px;
      text-align: right;
    }

    .rate-row-profit:empty {
      display: none;
    }

    @media (max-width: 560px) {
      .rate-row {
        grid-template-columns: 1fr;
        gap: 6px;
        padding: 12px;
      }
      .rate-row-label {
        font-size: 0.88rem;
        color: var(--text-muted);
      }
      .rate-row-profit {
        flex-direction: row;
        gap: 10px;
        align-items: center;
        justify-content: flex-end;
      }
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      font-size: 0.92rem;
      font-weight: 700;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap span {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.86rem;
      pointer-events: none;
      white-space: nowrap;
    }

    .input-wrap .suffix {
      right: 12px;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface-strong);
      color: var(--text);
      border-radius: var(--radius-md);
      padding: 13px 78px 13px 14px;
      font: inherit;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
    }

    .mile-input input {
      padding-right: 68px;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-soft);
    }

    .status-list {
      display: grid;
      gap: 8px;
      min-height: 18px;
    }

    .status {
      display: none;
      font-size: 0.82rem;
      line-height: 1.45;
    }

    .status.active {
      display: block;
    }

    .status.error {
      color: var(--danger);
    }

    .status.warning {
      color: var(--warning);
    }

    .status.info {
      color: var(--primary);
    }

    .profit-display {
      font-size: 0.8rem;
      font-weight: 700;
      min-height: 1.2em;
    }

    .profit-positive {
      color: var(--primary);
    }

    .profit-negative {
      color: var(--danger);
    }

    .output-grid {
      display: grid;
      gap: 12px;
    }

    .quote-list {
      display: grid;
      gap: 10px;
    }

    .quote-row {
      display: grid;
      gap: 4px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface-soft);
    }

    .quote-label {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.03em;
    }

    .quote-value {
      font-size: clamp(1.06rem, 2.6vw, 1.24rem);
      font-weight: 800;
      line-height: 1.35;
      word-break: break-word;
    }

    .message-wrap {
      display: grid;
      gap: 10px;
      margin-top: 2px;
    }

    .message-box {
      width: 100%;
      min-height: 210px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface-strong);
      color: var(--text);
      padding: 14px;
      font: inherit;
      line-height: 1.65;
      resize: vertical;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
    }

    .button {
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      color: #ffffff;
      padding: 11px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(15, 118, 110, 0.24);
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
    }

    .button:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 32px rgba(15, 118, 110, 0.26);
    }

    .button:active {
      transform: translateY(1px);
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none;
      box-shadow: none;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translate(-50%, 16px);
      background: rgba(17, 24, 39, 0.92);
      color: #f8fafc;
      padding: 12px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 700;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      z-index: 10;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 640px) {
      .shell {
        width: min(calc(100% - 16px), var(--max-width));
        padding-top: 14px;
      }

      .card-body {
        padding: 16px;
      }

      .rate-grid {
        gap: 10px;
      }

      .quote-row {
        padding: 12px 14px;
      }

      .message-box {
        min-height: 190px;
      }
    }

    .course-block {
      display: grid;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
    }

    .course-block + .course-block {
      margin-top: 10px;
    }

    .course-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .course-name {
      margin: 0;
      font-size: 1rem;
      font-weight: 800;
    }

    .course-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .course-discount .course-name {
      color: var(--primary);
    }

    .course-express .course-name {
      color: var(--warning);
    }

    .quote-group-title.course-discount {
      color: var(--primary);
    }

    .quote-group-title.course-express {
      color: var(--warning);
    }





    .quote-group-title {
      margin: 6px 0 0;
      font-size: 0.86rem;
      font-weight: 800;
    }

  </style>
</head>
<body>
  <main class="shell">
    <header class="app-header">
      <h1>マイル見積り</h1>
      <button id="copyButton" class="button" type="button" disabled>コピー</button>
    </header>

    <div class="mode-tabs" role="tablist">
      <button class="mode-tab active" data-mode="both" type="button" role="tab">通常版（ヤフオク＋銀行振込）</button>
      <button class="mode-tab" data-mode="auction-only" type="button" role="tab">ヤフオクのみ</button>
    </div>

    <section class="stack">
      <article class="card">
        <div class="card-body">
          <div class="input-group">
            <section>
              <h2 class="section-title">マイル数</h2>
              <div class="field mile-input">
                <div class="input-wrap">
                  <input id="mileCount" type="number" inputmode="numeric" step="1" min="0" placeholder="例: 120000">
                  <span class="suffix">マイル</span>
                </div>
              </div>
              <div class="status-list" aria-live="polite">
                <div class="status error" id="mileError"></div>
                <div class="status warning" id="mileWarning"></div>
                <div class="status info" id="mileAdjusted"></div>
              </div>
            </section>

            <section>
              <h2 class="section-title">レート設定</h2>
              <div id="courseRates"></div>
            </section>
          </div>
        </div>
      </article>

      <article class="card">
        <div class="card-body">
          <div class="output-grid">
            <section class="message-wrap">
              <h2 class="section-title">メッセージ</h2>
              <textarea id="messageBox" class="message-box" readonly aria-label="自動生成メッセージ">マイル数を入力すると、ここにご案内文を生成します。</textarea>
            </section>
          </div>
        </div>
      </article>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite">メッセージをコピーしました</div>

  <script>
    (() => {
      const STORAGE_KEY = "mile-quote-rates-v4";
      const MODE_KEY = "mile-quote-mode-v1";

      // コースの定義。並び順＝画面・メッセージ・表の表示順（48時間以内を先に、割引価格を後に）
      const COURSES = [
        {
          key: "express",
          name: "お急ぎになる場合",
          className: "course-express",
          lead: "48時間以内に加算",
          defaults: { auctionRate: 2.90, auctionDiscountRate: 2.85, bankRate: 2.68 }
        },
        {
          key: "discount",
          name: "割引価格",
          className: "course-discount",
          lead: "10日〜2週間程度で加算",
          intro: "マイルの反映までにお時間（10日〜2週間程度）がかかってもよろしければ割引価格でのご提供が可能です。",
          defaults: { auctionRate: 2.58, auctionDiscountRate: 2.55, bankRate: 2.45 }
        }
      ];
      const RATE_FIELDS = [
        { key: "auctionRate", label: "ヤフオク定価", channel: "auction", bankOnly: false },
        { key: "auctionDiscountRate", label: "ヤフオク値引", channel: "auction", bankOnly: false },
        { key: "bankRate", label: "銀行振込", channel: "bank", bankOnly: true }
      ];

      let currentMode = "both"; // "both" or "auction-only"
      let toastTimerId = null;

      const elements = {
        mileCount: document.getElementById("mileCount"),
        mileError: document.getElementById("mileError"),
        mileWarning: document.getElementById("mileWarning"),
        mileAdjusted: document.getElementById("mileAdjusted"),
        courseRates: document.getElementById("courseRates"),
        messageBox: document.getElementById("messageBox"),
        copyButton: document.getElementById("copyButton"),
        toast: document.getElementById("toast"),

      };

      const yen = (n) => `${new Intl.NumberFormat("ja-JP").format(n)}円`;
      const milesText = (n) => `${new Intl.NumberFormat("ja-JP").format(n)}マイル`;

      // ---- 保存と読み込み ----
      function loadSettings() {
        const base = { courses: {} };
        COURSES.forEach((c) => { base.courses[c.key] = { ...c.defaults }; });
        try {
          const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
          if (!stored) return base;
          COURSES.forEach((c) => {
            const sc = stored.courses?.[c.key] || {};
            RATE_FIELDS.forEach((f) => { if (Number.isFinite(sc[f.key])) base.courses[c.key][f.key] = sc[f.key]; });
          });
        } catch (error) { /* 既定値を使う */ }
        return base;
      }

      function saveSettings(settings) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(settings)); } catch (error) { /* ignore */ }
      }

      function parseNumber(input, fallback) {
        if (input.validity.badInput || input.value.trim() === "") return fallback;
        const v = Number(input.value);
        return Number.isFinite(v) && v >= 0 ? v : fallback;
      }

      // ---- 入力欄の生成 ----
      function buildRateInputs(settings) {
        elements.courseRates.innerHTML = "";
        COURSES.forEach((c) => {
          const block = document.createElement("div");
          block.className = `course-block ${c.className}`;
          block.innerHTML = `
            <div class="course-head">
              <h3 class="course-name">${c.name}</h3>
              <span class="course-meta" id="meta-${c.key}"></span>
            </div>
            <div class="rate-grid">
              ${RATE_FIELDS.map((f) => `
                <div class="rate-row${f.bankOnly ? " bank-only" : ""}">
                  <label class="rate-row-label" for="${c.key}-${f.key}">${f.label}</label>
                  <div class="input-wrap">
                    <input id="${c.key}-${f.key}" type="number" inputmode="decimal" step="0.01" min="0" value="${settings.courses[c.key][f.key].toFixed(2)}">
                    <span class="suffix">円/マイル</span>
                  </div>
                </div>`).join("")}
            </div>`;
          elements.courseRates.appendChild(block);
        });
      }

      function readSettings(prev) {
        const settings = { courses: {} };
        COURSES.forEach((c) => {
          settings.courses[c.key] = {};
          RATE_FIELDS.forEach((f) => {
            settings.courses[c.key][f.key] = parseNumber(document.getElementById(`${c.key}-${f.key}`), prev.courses[c.key][f.key]);
          });
        });
        return settings;
      }


      // ---- 見積りとメッセージ ----
      function roundUpToUnit(miles) {
        // 250マイル単位で切り上げ、最小500マイル
        return Math.max(Math.ceil(miles / 250) * 250, 500);
      }

      function getMilesState() {
        const raw = elements.mileCount.value.trim();
        if (elements.mileCount.validity.badInput) return { valid: false, error: "マイル数は数値で入力してください。" };
        if (raw === "") return { valid: false, error: "" };
        const inputMiles = Number(raw);
        if (!Number.isFinite(inputMiles)) return { valid: false, error: "マイル数は数値で入力してください。" };
        if (!Number.isInteger(inputMiles)) return { valid: false, error: "マイル数は整数で入力してください。" };
        if (inputMiles <= 0) return { valid: false, error: "マイル数は1以上で入力してください。" };
        const miles = roundUpToUnit(inputMiles);
        const adjusted = miles !== inputMiles
          ? `${new Intl.NumberFormat("ja-JP").format(inputMiles)} → ${new Intl.NumberFormat("ja-JP").format(miles)}マイルに調整（250マイル単位）`
          : "";
        return { valid: true, miles, adjusted };
      }

      function setStatus(element, message) {
        element.textContent = message;
        element.classList.toggle("active", Boolean(message));
      }

      function showToast(message) {
        elements.toast.textContent = message;
        elements.toast.classList.add("show");
        if (toastTimerId) clearTimeout(toastTimerId);
        toastTimerId = window.setTimeout(() => elements.toast.classList.remove("show"), 1800);
      }

      async function copyMessage() {
        const text = elements.messageBox.value;
        if (!text || elements.copyButton.disabled) return;
        try {
          if (!navigator.clipboard?.writeText) throw new Error("Clipboard API unavailable");
          await navigator.clipboard.writeText(text);
          showToast("メッセージをコピーしました");
        } catch (error) {
          elements.messageBox.focus();
          elements.messageBox.select();
          const copied = document.execCommand("copy");
          showToast(copied ? "メッセージをコピーしました" : "コピーできませんでした");
        } finally {
          window.getSelection()?.removeAllRanges();
        }
      }

      let settings = loadSettings();

      function update() {
        settings = readSettings(settings);
        saveSettings(settings);
        const bothMode = currentMode === "both";

        const milesState = getMilesState();
        setStatus(elements.mileError, milesState.error || "");
        setStatus(elements.mileWarning, "");
        setStatus(elements.mileAdjusted, milesState.adjusted || "");

        COURSES.forEach((c) => {
          document.getElementById(`meta-${c.key}`).textContent = c.lead;
        });

        if (!milesState.valid) {
          elements.messageBox.value = "マイル数を入力すると、ここにご案内文を生成します。";
          elements.copyButton.disabled = true;
          return;
        }

        const { miles } = milesState;
        const amounts = Object.fromEntries(COURSES.map((c) => {
          const r = settings.courses[c.key];
          return [c.key, {
            auction: Math.round(miles * r.auctionRate),
            discount: Math.round(miles * r.auctionDiscountRate),
            bank: Math.round(miles * r.bankRate)
          }];
        }));

        // メッセージ
        const adjustLine = milesState.adjusted
          ? `250マイルごとのご提供となりますため、${milesText(miles)}でお見積りいたします。`
          : `${milesText(miles)}でお見積りいたします。`;

        // 有効期限: 翌々日いっぱい
        const expiry = new Date();
        expiry.setDate(expiry.getDate() + 2);
        const dayNames = ["日", "月", "火", "水", "木", "金", "土"];
        const expiryDate = `${expiry.getMonth() + 1}月${expiry.getDate()}日（${dayNames[expiry.getDay()]}）`;

        const lines = [
          "この度はお問い合わせいただきありがとうございました。",
          "",
          adjustLine + "納期によって2つのコースからお選びいただけます。"
        ];

        COURSES.forEach((c) => {
          const r = settings.courses[c.key];
          const a = amounts[c.key];
          lines.push("", `【${c.name}：${c.lead}】`);
          if (c.intro) lines.push(c.intro);
          lines.push(`ヤフオクですと、${r.auctionRate.toFixed(2)}円/マイル（${yen(a.auction)}）のところお値引きさせて頂き、${yen(a.discount)}（${r.auctionDiscountRate.toFixed(2)}円/マイル）でいかがでしょうか。`);
          if (bothMode) {
            // 銀行振込は先に出るコースで紹介し、最安になる割引価格で「最もお安く」と案内する
            lines.push(c.key === "discount"
              ? `最もお安く済ませたい場合は、銀行振込みにて${yen(a.bank)}（${r.bankRate.toFixed(2)}円/マイル）でご提供が可能です。`
              : `また、直接当方への銀行振込みでしたら、${yen(a.bank)}（${r.bankRate.toFixed(2)}円/マイル）でご提供が可能です。`);
          }
        });

        lines.push(
          "",
          bothMode
            ? "ご希望のコースとお支払い方法をお知らせいただけましたら、出品または振込口座のご案内をいたします。"
            : "ご希望のコースをお知らせいただけましたら、出品いたします。",
          "",
          `なお、在庫確保の関係上、本見積りの有効期限は${expiryDate}いっぱいとさせていただきます。`,
          "",
          "以上、ご検討の程よろしくお願いします。"
        );

        elements.messageBox.value = lines.join("\n");
        elements.copyButton.disabled = false;
      }

      function applyMode(mode) {
        currentMode = mode;
        document.body.classList.toggle("mode-auction-only", mode === "auction-only");
        document.querySelectorAll(".mode-tab").forEach((tab) => tab.classList.toggle("active", tab.dataset.mode === mode));
        try { localStorage.setItem(MODE_KEY, mode); } catch (error) { /* ignore */ }
        update();
      }

      function initialize() {
        buildRateInputs(settings);

        document.querySelectorAll("#courseRates input, #mileCount").forEach((input) => {
          input.addEventListener("input", update);
          input.addEventListener("change", update);
        });
        elements.copyButton.addEventListener("click", copyMessage);
        document.querySelectorAll(".mode-tab").forEach((tab) => tab.addEventListener("click", () => applyMode(tab.dataset.mode)));

        const savedMode = (() => { try { return localStorage.getItem(MODE_KEY); } catch { return null; } })();
        applyMode(savedMode === "auction-only" ? "auction-only" : "both");
      }

      initialize();
    })();
  </script>
</body>
</html>
